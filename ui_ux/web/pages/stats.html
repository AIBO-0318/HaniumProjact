<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>I-Study | 학습 통계</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/style.css?v=4" />
</head>
<body>
  <div id="topbar"></div>

  <main class="page">
    <div class="page-header">
      <h1>학습 통계</h1>
      <p>집중도와 학습 시간을 한눈에</p>
    </div>

    <div class="seg-tabs" id="segTabs">
      <button data-tab="daily" class="active">일별 통계</button>
      <button data-tab="weekly">주별 통계</button>
    </div>

    <!-- 요약 카드 -->
    <div class="stat-row" id="summaryRow"></div>

    <!-- 차트 -->
    <div class="chart-wrap">
      <h3 id="chartTitle">일별 학습 시간</h3>
      <div class="chart-bars" id="chartBars"></div>
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/nav.js"></script>
  <script>
    Auth.requireLogin();
    let currentTab = "daily";

    document.querySelectorAll("#segTabs button").forEach(b => {
      b.addEventListener("click", () => {
        document.querySelectorAll("#segTabs button").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        currentTab = b.dataset.tab;
        render();
      });
    });

    async function render() {
      const endpoint = currentTab === "daily" ? "/stats/daily?days=7" : "/stats/weekly?weeks=4";
      const title = currentTab === "daily" ? "일별 학습 시간 (최근 7일)" : "주별 학습 시간 (최근 4주)";
      document.getElementById("chartTitle").textContent = title;

      try {
        const data = await Api.get(endpoint);
        const items = data.items || [];

        // 요약
        const totalMin = items.reduce((s, x) => s + (x.duration_min || 0), 0);
        const scores = items.filter(x => x.focus_score > 0).map(x => x.focus_score);
        const avgScore = scores.length ? (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1) : 0;
        const maxMin = Math.max(...items.map(x => x.duration_min || 0), 0);

        document.getElementById("summaryRow").innerHTML = `
          <div class="stat-card blue">
            <div class="label">총 학습 시간</div>
            <div class="value">${Math.floor(totalMin/60)}<span class="unit">시간</span> ${totalMin%60}<span class="unit">분</span></div>
          </div>
          <div class="stat-card mint">
            <div class="label">평균 집중도</div>
            <div class="value">${avgScore}<span class="unit">점</span></div>
          </div>
          <div class="stat-card peach">
            <div class="label">최다 학습</div>
            <div class="value">${maxMin}<span class="unit">분</span></div>
          </div>
        `;

        // 바 차트
        const max = Math.max(maxMin, 60);
        document.getElementById("chartBars").innerHTML = items.map(x => {
          const h = Math.round((x.duration_min || 0) / max * 100);
          const label = currentTab === "daily"
            ? x.date.slice(5)  // MM-DD
            : x.week_start.slice(5) + "~";
          return `
            <div class="chart-bar">
              <span class="bar-value">${x.duration_min || 0}분</span>
              <div class="bar" style="height:${h}%"></div>
              <span class="bar-label">${label}</span>
            </div>
          `;
        }).join("");

        if (!items.length || totalMin === 0) {
          document.getElementById("chartBars").innerHTML =
            `<div class="empty" style="width:100%">📊 아직 학습 기록이 없어요</div>`;
        }
      } catch (err) {
        document.getElementById("chartBars").innerHTML = `<div class="error-msg">${err.message}</div>`;
      }
    }

    render();
  </script>
</body>
</html>
