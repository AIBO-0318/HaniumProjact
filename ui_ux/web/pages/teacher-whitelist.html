<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>I-Study | 학생 화이트리스트</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/style.css?v=4" />
</head>
<body>
  <div id="topbar"></div>

  <main class="page">
    <div class="page-header">
      <h1>학생 화이트리스트</h1>
      <p>학생이 집중 모드에서 접근할 수 있는 사이트를 관리하세요</p>
    </div>

    <div class="schedule-grid">
      <!-- 목록 -->
      <section class="card">
        <div class="flex-between" style="margin-bottom:16px;flex-wrap:wrap;gap:12px">
          <h2>등록된 사이트</h2>
          <label style="font-size:13px;color:var(--ink-500);font-weight:600">
            학생
            <select id="studentSelect" class="input" style="margin-left:6px;width:auto"></select>
          </label>
        </div>
        <div id="urlList" class="schedule-list">
          <div class="empty">학생을 선택하세요</div>
        </div>
      </section>

      <!-- 추가 -->
      <section class="card">
        <h2>사이트 추가</h2>
        <p class="muted">학생 전용 허용 사이트를 등록합니다</p>
        <form id="addForm" style="display:flex;flex-direction:column;gap:14px">
          <label>
            <span style="font-size:13px;color:var(--ink-500);font-weight:600;margin-bottom:6px;display:block">사이트 이름</span>
            <input type="text" id="siteName" class="input full-width" placeholder="예: 칸 아카데미" required maxlength="50" />
          </label>
          <label>
            <span style="font-size:13px;color:var(--ink-500);font-weight:600;margin-bottom:6px;display:block">URL</span>
            <input type="url" id="siteUrl" class="input full-width" placeholder="https://www.khanacademy.org/" required />
          </label>
          <div id="addErr" class="error-msg"></div>
          <button type="submit" class="btn-primary">➕ 추가하기</button>
        </form>
      </section>
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/nav.js"></script>
  <script>
    Auth.requireLogin();
    const info = Auth.getInfo();
    if (info.role !== "TEACHER" && info.account_type !== "admin") { location.href = "/main"; }

    let students = [];
    function escape(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    }

    async function loadStudents() {
      let studentData;
      if (info.account_type === "admin") {
        const users = await Api.get("/admins/users");
        studentData = users.filter(u => u.role === "STUDENT");
      } else {
        const data = await Api.get("/users/teacher/students");
        studentData = data.students || [];
      }
      students = studentData;
      const sel = document.getElementById("studentSelect");
      if (!students.length) {
        sel.innerHTML = `<option value="">매칭된 학생이 없습니다</option>`;
        document.getElementById("urlList").innerHTML =
          `<div class="empty">매칭된 학생이 없습니다.</div>`;
        return;
      }
      sel.innerHTML = students.map(s =>
        `<option value="${s.id}">${escape(s.name)} (${s.login_id})</option>`
      ).join("");

      const qs = new URLSearchParams(location.search);
      const sid = qs.get("student_id");
      if (sid && students.find(s => s.id == sid)) sel.value = sid;

      loadList();
    }

    async function loadList() {
      const sid = document.getElementById("studentSelect").value;
      const list = document.getElementById("urlList");
      if (!sid) return;
      list.innerHTML = `<div class="empty">로딩 중…</div>`;
      try {
        const items = await Api.get(`/whitelist/student/${sid}`);
        if (!items.length) {
          list.innerHTML = `<div class="empty">📭 등록된 사이트가 없어요</div>`;
          return;
        }
        list.innerHTML = items.map(u => `
          <div class="schedule-item">
            <div class="bar"></div>
            <div class="body">
              <div class="title">${escape(u.name)}</div>
              <div class="memo">${escape(u.url)}</div>
            </div>
            <button class="btn-danger" onclick="delUrl(${u.id})">삭제</button>
          </div>
        `).join("");
      } catch (err) {
        list.innerHTML = `<div class="error-msg">${err.message}</div>`;
      }
    }

    window.delUrl = async (id) => {
      if (!confirm("이 사이트를 삭제할까요?")) return;
      try {
        await Api.del(`/whitelist/${id}`);
        loadList();
      } catch (err) { alert(err.message); }
    };

    document.getElementById("studentSelect").addEventListener("change", loadList);

    document.getElementById("addForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const sid = document.getElementById("studentSelect").value;
      const errEl = document.getElementById("addErr");
      errEl.textContent = "";
      if (!sid) { errEl.textContent = "학생을 선택하세요."; return; }
      try {
        await Api.post(`/whitelist/student/${sid}`, {
          name: document.getElementById("siteName").value.trim(),
          url:  document.getElementById("siteUrl").value.trim(),
        });
        document.getElementById("siteName").value = "";
        document.getElementById("siteUrl").value = "";
        loadList();
      } catch (err) { errEl.textContent = err.message; }
    });

    loadStudents();
  </script>
</body>
</html>
