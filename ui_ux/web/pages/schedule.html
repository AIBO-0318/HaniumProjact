<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>I-Study | 일정표</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="topbar"></div>

  <main class="page">
    <div class="page-header">
      <h1>일정표</h1>
      <p>학습 일정을 관리하세요</p>
    </div>

    <div class="schedule-grid">
      <!-- 일정 확인 -->
      <section class="card">
        <div class="flex-between" style="margin-bottom:16px">
          <h2>일정 확인</h2>
          <input type="date" id="filterDate" class="input"
                 style="width:auto" />
        </div>
        <div id="scheduleList" class="schedule-list">
          <div class="empty">로딩 중…</div>
        </div>
      </section>

      <!-- 일정 추가 -->
      <section class="card">
        <h2>일정 추가</h2>
        <p class="muted">새로운 학습 일정을 등록하세요</p>
        <form id="addForm" style="display:flex;flex-direction:column;gap:14px">
          <label>
            <span style="font-size:13px;color:var(--ink-500);font-weight:600;margin-bottom:6px;display:block">날짜</span>
            <input type="date" id="date" class="input full-width" required />
          </label>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <label>
              <span style="font-size:13px;color:var(--ink-500);font-weight:600;margin-bottom:6px;display:block">시작</span>
              <input type="time" id="startTime" class="input full-width" />
            </label>
            <label>
              <span style="font-size:13px;color:var(--ink-500);font-weight:600;margin-bottom:6px;display:block">종료</span>
              <input type="time" id="endTime" class="input full-width" />
            </label>
          </div>
          <label>
            <span style="font-size:13px;color:var(--ink-500);font-weight:600;margin-bottom:6px;display:block">제목</span>
            <input type="text" id="title" class="input full-width" placeholder="예: 수학 문제집 풀이" required maxlength="200" />
          </label>
          <label>
            <span style="font-size:13px;color:var(--ink-500);font-weight:600;margin-bottom:6px;display:block">메모</span>
            <textarea id="memo" class="input full-width" rows="3" placeholder="선택 사항"></textarea>
          </label>
          <div>
            <span style="font-size:13px;color:var(--ink-500);font-weight:600;margin-bottom:8px;display:block">색상</span>
            <div class="color-picker">
              <label><input type="radio" name="color" value="blue" checked /><span class="swatch blue"></span></label>
              <label><input type="radio" name="color" value="purple" /><span class="swatch purple"></span></label>
              <label><input type="radio" name="color" value="mint" /><span class="swatch mint"></span></label>
              <label><input type="radio" name="color" value="peach" /><span class="swatch peach"></span></label>
              <label><input type="radio" name="color" value="lemon" /><span class="swatch lemon"></span></label>
            </div>
          </div>
          <div id="addErr" class="error-msg"></div>
          <button type="submit" class="btn-primary">➕ 추가하기</button>
        </form>
      </section>
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/nav.js"></script>
  <script>
    Auth.requireLogin();
    const today = new Date().toISOString().slice(0, 10);
    document.getElementById("date").value = today;
    document.getElementById("filterDate").value = today;

    async function loadList() {
      const d = document.getElementById("filterDate").value;
      const list = document.getElementById("scheduleList");
      list.innerHTML = `<div class="empty">로딩 중…</div>`;
      try {
        const items = await Api.get(`/schedules?date_from=${d}&date_to=${d}`);
        if (!items.length) {
          list.innerHTML = `<div class="empty">📭 이 날짜에 일정이 없어요</div>`;
          return;
        }
        list.innerHTML = items.map(s => `
          <div class="schedule-item color-${s.color || 'blue'} ${s.is_done ? 'done' : ''}" data-id="${s.id}">
            <div class="bar"></div>
            <button class="check" title="완료 여부" onclick="toggleDone(${s.id}, ${s.is_done ? 0 : 1})">✓</button>
            <div class="when">
              <strong>${s.date}</strong>
              ${s.start_time ? s.start_time : ''}${s.end_time ? ' ~ ' + s.end_time : ''}
            </div>
            <div class="body">
              <div class="title">${escape(s.title)}</div>
              ${s.memo ? `<div class="memo">${escape(s.memo)}</div>` : ''}
            </div>
            <button class="btn-danger" onclick="delSchedule(${s.id})">삭제</button>
          </div>
        `).join("");
      } catch (err) {
        list.innerHTML = `<div class="error-msg">${err.message}</div>`;
      }
    }

    function escape(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c])
      );
    }

    window.delSchedule = async (id) => {
      if (!confirm("이 일정을 삭제할까요?")) return;
      await Api.del(`/schedules/${id}`);
      loadList();
    };

    window.toggleDone = async (id, next) => {
      try {
        await Api.patch(`/schedules/${id}`, { is_done: next });
        loadList();
      } catch (err) { alert(err.message); }
    };

    document.getElementById("filterDate").addEventListener("change", loadList);

    document.getElementById("addForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("addErr");
      errEl.textContent = "";
      const payload = {
        date: document.getElementById("date").value,
        start_time: document.getElementById("startTime").value || null,
        end_time: document.getElementById("endTime").value || null,
        title: document.getElementById("title").value.trim(),
        memo: document.getElementById("memo").value.trim() || null,
        color: document.querySelector('input[name=color]:checked').value,
      };
      try {
        await Api.post("/schedules", payload);
        document.getElementById("title").value = "";
        document.getElementById("memo").value = "";
        if (payload.date === document.getElementById("filterDate").value) loadList();
        else document.getElementById("filterDate").value = payload.date, loadList();
      } catch (err) { errEl.textContent = err.message; }
    });

    loadList();
  </script>
</body>
</html>
