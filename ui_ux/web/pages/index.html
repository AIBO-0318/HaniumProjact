<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>I-Study | 로그인</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="brand">
        <h1>📘 I-Study</h1>
        <p class="subtitle">스마트 학습 도우미</p>
      </div>

      <!-- 탭: 사용자 / 관리자 -->
      <div class="tabs">
        <button class="tab active" data-tab="user">사용자</button>
        <button class="tab" data-tab="admin">관리자</button>
      </div>

      <form id="loginForm" class="auth-form">
        <label>
          <span>아이디</span>
          <input type="text" id="loginId" required minlength="4" autocomplete="username" />
        </label>
        <label>
          <span>비밀번호</span>
          <input type="password" id="password" required minlength="6" autocomplete="current-password" />
        </label>

        <div id="errorMsg" class="error-msg"></div>

        <button type="submit" class="btn-primary">로그인</button>
      </form>

      <div class="auth-footer">
        <span>처음이신가요?</span>
        <a href="/signup">회원가입</a>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    // 탭 전환
    let currentTab = "user";
    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentTab = btn.dataset.tab;
      });
    });

    // 로그인 처리
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const loginId = document.getElementById("loginId").value.trim();
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("errorMsg");
      errEl.textContent = "";

      try {
        if (currentTab === "user") {
          await Auth.userLogin(loginId, password);
        } else {
          await Auth.adminLogin(loginId, password);
        }
        location.href = "/main";
      } catch (err) {
        errEl.textContent = err.message || "로그인 실패";
      }
    });

    // 이미 로그인되어 있으면 홈으로
    if (Auth.getToken()) {
      location.href = "/main";
    }
  </script>
</body>
</html>
