<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>I-Study | 회원가입</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/style.css?v=4" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="brand">
        <h1>📘 I-Study</h1>
        <p class="subtitle">회원가입</p>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="user">사용자</button>
        <button class="tab" data-tab="admin">관리자</button>
      </div>

      <form id="signupForm" class="auth-form">
        <label>
          <span>아이디 <small>(4~32자, 영숫자/_)</small></span>
          <input type="text" id="loginId" required minlength="4" maxlength="32"
                 pattern="[a-zA-Z0-9_]+" autocomplete="username" />
        </label>
        <label>
          <span>비밀번호 <small>(6자 이상)</small></span>
          <input type="password" id="password" required minlength="6" maxlength="64"
                 autocomplete="new-password" />
        </label>
        <label>
          <span>비밀번호 확인</span>
          <input type="password" id="passwordConfirm" required minlength="6" />
        </label>
        <label>
          <span>이름</span>
          <input type="text" id="name" required maxlength="50" />
        </label>

        <!-- 사용자 전용: 역할 -->
        <label id="roleField">
          <span>역할</span>
          <select id="role">
            <option value="STUDENT">학생</option>
            <option value="TEACHER">학습지도자</option>
          </select>
        </label>

        <!-- 학습지도자 전용: 관리할 학생 아이디 -->
        <label id="studentField" style="display:none">
          <span>관리할 학생 아이디 <small>(학생이 먼저 가입되어 있어야 합니다)</small></span>
          <input type="text" id="studentLoginId" minlength="4" maxlength="32"
                 pattern="[a-zA-Z0-9_]+" placeholder="예: alice" />
        </label>

        <!-- 관리자 전용: 등급 -->
        <label id="levelField" style="display:none">
          <span>관리자 등급 (1~9)</span>
          <input type="number" id="level" value="1" min="1" max="9" />
        </label>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <button type="submit" class="btn-primary">가입하기</button>
      </form>

      <div class="auth-footer">
        <a href="/">← 로그인으로</a>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    let currentTab = "user";

    function applyTab() {
      document.getElementById("roleField").style.display = currentTab === "user" ? "" : "none";
      document.getElementById("levelField").style.display = currentTab === "admin" ? "" : "none";
      document.getElementById("password").minLength = currentTab === "admin" ? 8 : 6;
      applyRole();
    }

    function applyRole() {
      const role = document.getElementById("role").value;
      const showStudent = currentTab === "user" && role === "TEACHER";
      document.getElementById("studentField").style.display = showStudent ? "" : "none";
      document.getElementById("studentLoginId").required = showStudent;
    }

    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentTab = btn.dataset.tab;
        applyTab();
      });
    });
    document.getElementById("role").addEventListener("change", applyRole);
    applyTab();

    document.getElementById("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("errorMsg");
      const okEl = document.getElementById("successMsg");
      errEl.textContent = ""; okEl.textContent = "";

      const loginId = document.getElementById("loginId").value.trim();
      const password = document.getElementById("password").value;
      const passwordConfirm = document.getElementById("passwordConfirm").value;
      const name = document.getElementById("name").value.trim();

      if (password !== passwordConfirm) {
        errEl.textContent = "비밀번호가 일치하지 않습니다.";
        return;
      }

      try {
        if (currentTab === "user") {
          const role = document.getElementById("role").value;
          const payload = { login_id: loginId, password, name, role };
          if (role === "TEACHER") {
            const sid = document.getElementById("studentLoginId").value.trim();
            if (!sid) { errEl.textContent = "관리할 학생 아이디를 입력하세요."; return; }
            payload.student_login_id = sid;
          }
          await Auth.userSignup(payload);
        } else {
          const level = parseInt(document.getElementById("level").value, 10);
          await Auth.adminSignup({ admin_id: loginId, password, name, level });
        }
        okEl.textContent = "가입 완료! 로그인 페이지로 이동합니다…";
        setTimeout(() => location.href = "/", 1500);
      } catch (err) {
        errEl.textContent = err.message || "가입 실패";
      }
    });
  </script>
</body>
</html>
