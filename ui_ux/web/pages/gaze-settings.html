<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>I-Study | 시선 설정</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="3;url=/main" />
  <link rel="stylesheet" href="/static/css/style.css?v=4" />
  <style>
    .threshold-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }
    .threshold-card {
      background: #fff;
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: all .15s;
    }
    .threshold-card:hover { box-shadow: var(--shadow-md); }
    .threshold-card .head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
    .threshold-card .icon-3d { width: 40px; height: 40px; font-size: 20px; border-radius: 14px; margin: 0; }
    .threshold-card h3 { margin: 0; font-size: 15px; font-weight: 700; }
    .threshold-card .desc {
      font-size: 12px; color: var(--ink-400);
      margin: 6px 0 14px; line-height: 1.5;
    }
    .threshold-card .value-row {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 10px;
    }
    .threshold-card .value {
      font-size: 24px; font-weight: 800;
      color: var(--blue-600); letter-spacing: -0.02em;
    }
    .threshold-card .unit { font-size: 13px; color: var(--ink-400); margin-left: 4px; font-weight: 600; }
    .threshold-card .range-meta {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--ink-300); margin-top: 4px;
    }
    /* 슬라이더 */
    input[type=range].slider {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 8px;
      background: linear-gradient(90deg, var(--blue-200), var(--blue-100));
      border-radius: 999px; outline: none;
    }
    input[type=range].slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 22px; height: 22px;
      background: linear-gradient(180deg, #fff, #f0f6ff);
      border: 2px solid var(--blue-500);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 4px 10px -2px rgba(49,130,246,0.4);
    }
    input[type=range].slider::-moz-range-thumb {
      width: 22px; height: 22px;
      background: #fff;
      border: 2px solid var(--blue-500);
      border-radius: 50%;
      cursor: pointer;
    }
    .save-bar {
      position: sticky; bottom: 16px;
      display: flex; gap: 10px; align-items: center;
      margin-top: 24px;
      padding: 14px 18px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }
    .save-bar .save-msg { color: var(--ink-400); font-size: 13px; flex: 1; }
    .save-bar .save-msg.dirty { color: var(--blue-600); font-weight: 600; }
    .save-bar .save-msg.saved { color: #0bab5d; font-weight: 600; }
  </style>
</head>
<body>
  <div id="topbar"></div>

  <main class="page">
    <div class="page-header">
      <h1>시선 설정</h1>
      <p>이 기능은 데스크톱 앱으로 이전되었습니다</p>
    </div>
    <div class="card" style="max-width:480px;margin:0 auto;text-align:center;padding:40px 32px;">
      <div style="font-size:3rem;margin-bottom:16px;">💻</div>
      <h2 style="margin:0 0 8px">I-Study 앱을 사용하세요</h2>
      <p class="muted" style="margin-bottom:24px;">시선 추적 설정 기능은 데스크톱 앱에서만 제공됩니다.<br>3초 후 홈으로 이동합니다.</p>
      <a href="/main" class="btn-primary" style="display:inline-block;text-decoration:none;">홈으로 가기</a>
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/nav.js"></script>
  <script>Auth.requireLogin();</script>
</body>
</html>
<!-- DEAD_CODE_START

    <div class="card">
      <h2>임계치</h2>
      <p class="muted">슬라이더를 움직여 값을 조정한 뒤, 아래 [저장] 버튼을 눌러주세요.</p>

      <div class="threshold-grid" id="grid"></div>
    </div>

    <div class="save-bar">
      <button class="btn-ghost" id="resetBtn">↺ 기본값으로</button>
      <span class="save-msg" id="saveMsg">변경 사항이 없습니다</span>
      <button class="btn-primary" id="saveBtn" disabled>💾 저장</button>
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/nav.js"></script>
  <script>
    Auth.requireLogin();
    if (Auth.getInfo().role !== "STUDENT") { location.href = "/main"; }

    // 임계치 메타정보 (UI 빌드 + 검증용 — 서버 스키마와 일치)
    const FIELDS = [
      {
        key: "ear_threshold", label: "눈 감음 임계 (EAR)", icon: "👁️", color: "blue",
        desc: "눈이 감겼다고 판단하는 EAR 값. 낮을수록 더 많이 감겨야 인식됩니다.",
        min: 0.05, max: 0.5, step: 0.01, unit: "", decimals: 2,
      },
      {
        key: "eye_closure_threshold", label: "눈 감음 시간", icon: "💤", color: "purple",
        desc: "이 시간(초) 이상 눈을 감으면 졸음으로 간주합니다.",
        min: 1, max: 30, step: 0.5, unit: "초", decimals: 1,
      },
      {
        key: "yaw_threshold", label: "좌우 시선 이탈 (Yaw)", icon: "↔️", color: "mint",
        desc: "고개가 좌우로 이 각도(도) 이상 벗어나면 이탈로 인식.",
        min: 5, max: 60, step: 1, unit: "°", decimals: 0,
      },
      {
        key: "pitch_threshold", label: "상하 시선 이탈 (Pitch)", icon: "↕️", color: "mint",
        desc: "고개가 상하로 이 각도(도) 이상 벗어나면 이탈로 인식.",
        min: 5, max: 60, step: 1, unit: "°", decimals: 0,
      },
      {
        key: "pose_lost_threshold", label: "이탈 판정 시간", icon: "⏱️", color: "peach",
        desc: "이탈 상태가 이 시간(초) 이상 지속되면 알림.",
        min: 0.5, max: 15, step: 0.5, unit: "초", decimals: 1,
      },
      {
        key: "daze_variance_thr", label: "멍때림 분산", icon: "🌫️", color: "lemon",
        desc: "시선 분산(px²)이 이 값 미만이면 멍때림 후보.",
        min: 50, max: 2000, step: 10, unit: "px²", decimals: 0,
      },
      {
        key: "daze_duration_sec", label: "멍때림 판정 시간", icon: "🧐", color: "lemon",
        desc: "멍때림 상태가 이 시간(초) 이상 지속되면 알림.",
        min: 0.5, max: 15, step: 0.5, unit: "초", decimals: 1,
      },
      {
        key: "alpha_iris", label: "Iris 가중치", icon: "🎯", color: "blue",
        desc: "시선 추정 시 홍채(눈) 정보의 비중. 클수록 눈동자 우선, 작을수록 머리 방향 우선.",
        min: 0.0, max: 1.0, step: 0.05, unit: "", decimals: 2,
      },
    ];

    const DEFAULTS = {
      ear_threshold: 0.18, eye_closure_threshold: 5.0,
      yaw_threshold: 20.0, pitch_threshold: 15.0, pose_lost_threshold: 3.0,
      daze_variance_thr: 300.0, daze_duration_sec: 2.0,
      alpha_iris: 0.85,
    };

    let original = {};
    let current = {};

    function fmt(v, d) { return Number(v).toFixed(d); }

    function renderGrid() {
      const grid = document.getElementById("grid");
      grid.innerHTML = FIELDS.map(f => `
        <div class="threshold-card">
          <div class="head">
            <div class="icon-3d ${f.color}">${f.icon}</div>
            <h3>${f.label}</h3>
          </div>
          <div class="desc">${f.desc}</div>
          <div class="value-row">
            <span><span class="value" id="val-${f.key}">${fmt(current[f.key], f.decimals)}</span><span class="unit">${f.unit}</span></span>
          </div>
          <input type="range" class="slider"
                 id="rng-${f.key}"
                 min="${f.min}" max="${f.max}" step="${f.step}"
                 value="${current[f.key]}" />
          <div class="range-meta">
            <span>${f.min}${f.unit}</span>
            <span>${f.max}${f.unit}</span>
          </div>
        </div>
      `).join("");

      FIELDS.forEach(f => {
        const rng = document.getElementById(`rng-${f.key}`);
        const val = document.getElementById(`val-${f.key}`);
        rng.addEventListener("input", () => {
          current[f.key] = parseFloat(rng.value);
          val.textContent = fmt(current[f.key], f.decimals);
          updateSaveState();
        });
      });
    }

    function updateSaveState() {
      const dirty = FIELDS.some(f => Math.abs(current[f.key] - original[f.key]) > 1e-6);
      const btn = document.getElementById("saveBtn");
      const msg = document.getElementById("saveMsg");
      btn.disabled = !dirty;
      msg.className = "save-msg" + (dirty ? " dirty" : "");
      msg.textContent = dirty ? "저장되지 않은 변경사항이 있어요" : "변경 사항이 없습니다";
    }

    async function load() {
      try {
        const data = await Api.get("/gaze-settings/me");
        FIELDS.forEach(f => { current[f.key] = data[f.key]; });
        original = { ...current };
        renderGrid();
        updateSaveState();
      } catch (err) {
        document.getElementById("grid").innerHTML =
          `<div class="error-msg">${err.message}</div>`;
      }
    }

    document.getElementById("saveBtn").addEventListener("click", async () => {
      try {
        const res = await Api.put("/gaze-settings/me", current);
        FIELDS.forEach(f => { current[f.key] = res[f.key]; });
        original = { ...current };
        renderGrid();
        const msg = document.getElementById("saveMsg");
        msg.className = "save-msg saved";
        msg.textContent = "✓ 저장 완료";
        setTimeout(updateSaveState, 1500);
      } catch (err) {
        alert("저장 실패: " + err.message);
      }
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("모든 값을 기본값으로 되돌릴까요? (저장 버튼을 눌러야 적용됩니다)")) return;
      current = { ...DEFAULTS };
      renderGrid();
      updateSaveState();
    });

    load();
  </script>
</body>
</html>
