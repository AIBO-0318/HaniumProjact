<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>I-Study | 시선 추적</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/style.css?v=4" />
</head>
<body>
  <div id="topbar"></div>

  <main class="page">
    <div class="page-header">
      <h1>시선 추적</h1>
      <p>웹캠을 통해 실시간으로 집중도를 측정해요</p>
    </div>

    <section class="card">
      <div class="webcam-row">
        <div class="webcam-wrap">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="overlay"></canvas>
        </div>
        <div class="status-panel">
          <div class="stat">
            <label>연결</label>
            <span id="wsStatus" class="dot off"></span>
            <span id="wsStatusText">disconnected</span>
          </div>
          <div class="stat">
            <label>얼굴 감지</label>
            <span id="faceStatus">-</span>
          </div>
          <div class="stat">
            <label>집중 상태</label>
            <span id="focusState">-</span>
          </div>
          <div class="stat">
            <label>집중 점수</label>
            <span id="focusScore">-</span>
          </div>
          <div class="stat">
            <label>Yaw / Pitch</label>
            <span id="headPose">-</span>
          </div>

          <div class="controls">
            <button id="startBtn" class="btn-primary">▶ 시작</button>
            <button id="stopBtn" class="btn-ghost" disabled>■ 정지</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/nav.js"></script>
  <script src="/static/js/webcam.js"></script>
  <script>Auth.requireLogin();</script>
</body>
</html>
