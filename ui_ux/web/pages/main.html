<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>I-Study | 홈</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/style.css?v=4" />
</head>
<body>
  <div id="topbar"></div>

  <main class="page">
    <div class="page-header">
      <h1 id="greeting">안녕하세요 👋</h1>
      <p id="subText">오늘도 집중해서 학습해볼까요?</p>
    </div>

    <!-- 학생 전용: 빠른 요약 -->
    <div class="stat-row" id="summaryRow" style="display:none">
      <div class="stat-card blue">
        <div class="label">오늘 학습 시간</div>
        <div class="value" id="todayMin">0<span class="unit">분</span></div>
      </div>
      <div class="stat-card mint">
        <div class="label">평균 집중도</div>
        <div class="value" id="avgScore">0<span class="unit">점</span></div>
      </div>
      <div class="stat-card peach">
        <div class="label">오늘 일정</div>
        <div class="value" id="todayCount">0<span class="unit">개</span></div>
      </div>
    </div>

    <!-- 메뉴 타일 -->
    <div class="card">
      <h2>메뉴</h2>
      <p class="muted" id="menuHint">원하는 기능을 선택하세요</p>
      <div class="tile-grid" id="tileGrid"></div>
    </div>

    <!-- 지도자 전용: 매칭된 학생 정보 -->
    <div class="card" id="teacherCard" style="display:none">
      <h2>매칭된 학생</h2>
      <p class="muted">관리 중인 학생의 일정과 화이트리스트를 관리할 수 있어요</p>
      <div id="studentList" class="user-list">로딩 중…</div>
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/nav.js"></script>
  <script>
    Auth.requireLogin();
    const info = Auth.getInfo();
    const role = info.role;

    document.getElementById("greeting").textContent = `안녕하세요, ${info.name}님 👋`;

    // ─── 역할별 타일 ───
    const TILES = {
      STUDENT: [
        { href: "/schedule",  icon: "📅", color: "blue",   title: "일정표",          desc: "학습 일정 확인 · 추가 · 삭제" },
        { href: "/stats",     icon: "📊", color: "mint",   title: "학습 통계",       desc: "일별 · 주별 집중도 리포트" },
        { href: "/whitelist", icon: "🛡️", color: "mint",   title: "내 화이트리스트", desc: "학습 중 허용된 사이트 확인" },
        { href: "/mypage",    icon: "👤", color: "peach",  title: "마이페이지",      desc: "내 정보 · 계정 관리" },
      ],
      TEACHER: [
        { href: "/teacher-schedule",  icon: "📅", color: "blue",   title: "학생 일정 조회",       desc: "매칭된 학생의 일정 확인 (읽기 전용)" },
        { href: "/teacher-whitelist", icon: "🛡️", color: "mint",   title: "학생 화이트리스트",     desc: "학생이 접근할 수 있는 사이트 관리" },
        { href: "/mypage",            icon: "👤", color: "peach",  title: "마이페이지",           desc: "내 정보 · 매칭 학생 확인" },
      ],
      ADMIN: [
        { href: "/admin-users",       icon: "🛡️", color: "blue",   title: "사용자 관리",       desc: "가입 승인 · 사용자 목록 · 비활성화" },
        { href: "/admin-stats",       icon: "📊", color: "mint",   title: "학생 통계 조회",    desc: "전체 학생의 학습 통계 확인" },
        { href: "/teacher-schedule",  icon: "📅", color: "peach",  title: "학생 일정 조회",    desc: "전체 학생의 일정 확인" },
        { href: "/teacher-whitelist", icon: "🌐", color: "purple", title: "화이트리스트 관리", desc: "학생별 허용 사이트 관리" },
        { href: "/mypage",            icon: "👤", color: "peach",  title: "마이페이지",        desc: "내 정보 · 로그아웃" },
      ],
    };

    function renderTiles() {
      const list = TILES[role] || TILES.STUDENT;
      document.getElementById("tileGrid").innerHTML = list.map(t => `
        <a class="tile" href="${t.href}">
          <div class="icon-3d ${t.color}">${t.icon}</div>
          <h3>${t.title}</h3>
          <p>${t.desc}</p>
        </a>
      `).join("");
    }
    renderTiles();

    // ─── 역할별 추가 영역 ───
    if (role === "STUDENT") {
      document.getElementById("summaryRow").style.display = "";
      (async () => {
        try {
          const today = new Date().toISOString().slice(0,10);
          const [daily, schedules] = await Promise.all([
            Api.get("/stats/daily?days=1"),
            Api.get(`/schedules?date_from=${today}&date_to=${today}`),
          ]);
          const t = daily.items[0] || {};
          document.getElementById("todayMin").innerHTML = `${t.duration_min || 0}<span class="unit">분</span>`;
          document.getElementById("avgScore").innerHTML = `${t.focus_score || 0}<span class="unit">점</span>`;
          document.getElementById("todayCount").innerHTML = `${schedules.length}<span class="unit">개</span>`;
        } catch (e) { console.warn(e); }
      })();
    } else if (role === "TEACHER") {
      document.getElementById("subText").textContent =
        "매칭된 학생의 학습을 도와주세요";
      document.getElementById("teacherCard").style.display = "";
      (async () => {
        try {
          const data = await Api.get("/users/teacher/students");
          const list = document.getElementById("studentList");
          if (!data.students || data.students.length === 0) {
            list.innerHTML = `<div class="empty">아직 매칭된 학생이 없습니다.</div>`;
            return;
          }
          list.innerHTML = data.students.map(s => `
            <div class="user-row">
              <span class="role-badge STUDENT">학생</span>
              <strong>${s.login_id}</strong> · ${s.name}
              <a class="btn-soft" href="/teacher-schedule?student_id=${s.id}" style="margin-left:auto">일정 보기</a>
              <a class="btn-soft" href="/admin-stats?student_id=${s.id}">통계 보기</a>
              <a class="btn-soft" href="/teacher-whitelist?student_id=${s.id}">화이트리스트</a>
            </div>
          `).join("");
        } catch (err) {
          document.getElementById("studentList").innerHTML =
            `<div class="error-msg">${err.message}</div>`;
        }
      })();
    } else if (role === "ADMIN") {
      document.getElementById("subText").textContent = "시스템을 관리해주세요";
    }
  </script>
</body>
</html>
