<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>I-Study | 마이페이지</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="topbar"></div>

  <main class="page" style="max-width:720px">
    <div class="page-header">
      <h1>마이페이지</h1>
      <p>내 정보를 확인하세요</p>
    </div>

    <div class="card">
      <div class="profile">
        <div class="avatar" id="avatar">?</div>
        <div>
          <div class="name" id="pName">-</div>
          <div class="sub" id="pSub">-</div>
        </div>
      </div>

      <h3>계정 정보</h3>
      <div class="info-row">
        <span class="k">아이디</span>
        <span class="v" id="iLoginId">-</span>
      </div>
      <div class="info-row">
        <span class="k">이름</span>
        <span class="v" id="iName">-</span>
      </div>
      <div class="info-row">
        <span class="k">역할</span>
        <span class="v" id="iRole">-</span>
      </div>
      <div class="info-row">
        <span class="k">가입일</span>
        <span class="v" id="iCreated">-</span>
      </div>
      <div class="info-row">
        <span class="k">계정 상태</span>
        <span class="v" id="iStatus">-</span>
      </div>

      <div class="flex-row mt-20" style="justify-content:flex-end;gap:8px">
        <button class="btn-ghost" onclick="Auth.logout(); location.href='/'">로그아웃</button>
      </div>
    </div>

    <!-- 관리자만 보이는 영역 -->
    <div id="adminArea" class="card" style="display:none">
      <h2>관리자 · 사용자 관리</h2>
      <p class="muted">가입된 사용자 목록</p>
      <div id="userList" class="user-list">로딩 중…</div>
    </div>
  </main>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/nav.js"></script>
  <script>
    Auth.requireLogin();
    const info = Auth.getInfo();

    const roleKo = { STUDENT: "학생", TEACHER: "학습지도자", ADMIN: "관리자" };

    document.getElementById("avatar").textContent = (info.name || "?")[0];
    document.getElementById("pName").textContent = info.name;
    document.getElementById("pSub").textContent =
      `${roleKo[info.role] || info.role} · ${info.account_type === 'admin' ? '관리자 계정' : '일반 계정'}`;

    (async () => {
      try {
        const endpoint = info.account_type === "admin" ? "/admins/me" : "/users/me";
        const me = await Api.get(endpoint);
        document.getElementById("iLoginId").textContent = me.login_id || me.admin_id;
        document.getElementById("iName").textContent = me.name;
        document.getElementById("iRole").textContent = roleKo[me.role] || (me.level ? `관리자 (Lv.${me.level})` : "-");
        document.getElementById("iCreated").textContent = (me.created_at || "").slice(0, 10);
        document.getElementById("iStatus").textContent =
          me.is_active === 0 ? "⏳ 승인 대기" : "✅ 승인됨";
      } catch (err) {
        console.error(err);
      }
    })();

    // 관리자 패널
    if (info.account_type === "admin") {
      document.getElementById("adminArea").style.display = "";
      Api.get("/admins/users").then(users => {
        document.getElementById("userList").innerHTML = users.length ? users.map(u => {
          // 매칭 정보 (역할별)
          let match = "";
          if (u.role === "STUDENT") {
            match = u.teacher_login_id
              ? `<span class="match">👨‍🏫 지도자: <strong>${u.teacher_name}</strong> (${u.teacher_login_id})</span>`
              : `<span class="match muted-match">지도자 미배정</span>`;
          } else if (u.role === "TEACHER") {
            const cnt = (u.students || []).length;
            match = cnt > 0
              ? `<span class="match">🎓 학생 ${cnt}명: <strong>${u.students.map(s => s.name + ' (' + s.login_id + ')').join(', ')}</strong></span>`
              : `<span class="match muted-match">관리 학생 없음</span>`;
          }
          return `
            <div class="user-row">
              <span class="role-badge ${u.role}">${roleKo[u.role] || u.role}</span>
              <div class="user-info">
                <div><strong>${u.login_id}</strong> · ${u.name}</div>
                ${match ? `<div class="user-match">${match}</div>` : ""}
              </div>
              <span class="${u.is_active ? 'ok' : 'pending'}">${u.is_active ? "승인됨" : "승인 대기"}</span>
              ${!u.is_active ? `<button onclick="approveUser(${u.id})">승인</button>` : ""}
            </div>
          `;
        }).join("") : `<div class="empty">사용자가 없습니다.</div>`;
      }).catch(err => {
        document.getElementById("userList").innerHTML = `<div class="error-msg">${err.message}</div>`;
      });
    }

    window.approveUser = async (id) => {
      await Api.post(`/admins/users/${id}/approve`);
      location.reload();
    };
  </script>
</body>
</html>
